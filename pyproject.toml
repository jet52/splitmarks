[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "splitmarks"
version = "2.0.2"
description = "Split PDF files at top-level bookmarks into separate files"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pypdf>=3.17.0",
]

[project.scripts]
splitmarks = "splitmarks:main"
