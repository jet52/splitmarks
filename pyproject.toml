[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "splitmarks"
version = "2.2.0"
description = "Split PDF files at top-level bookmarks into separate files"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pypdf>=3.17.0",
]

[project.scripts]
splitmarks = "splitmarks:main"
textquality = "textquality:main"

# Listed explicitly: flat-layout auto-discovery is ambiguous once there is more
# than one top-level module, and splitmarks.py imports textquality by name, so
# the two must install side by side.
[tool.setuptools]
py-modules = ["splitmarks", "textquality"]
