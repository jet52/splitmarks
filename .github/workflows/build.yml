name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: splitmarks
            asset_name: splitmarks-linux
          - os: windows-latest
            artifact_name: splitmarks.exe
            asset_name: splitmarks-windows.exe
          - os: macos-latest
            artifact_name: splitmarks
            asset_name: splitmarks-macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pikepdf

      - name: Build executable
        run: pyinstaller --onefile --name splitmarks splitmarks.py

      - name: Ad-hoc sign macOS binary
        if: runner.os == 'macOS'
        run: codesign --force --sign - dist/splitmarks

      - name: Rename asset
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.artifact_name }}" != "${{ matrix.asset_name }}" ]; then
            mv "${{ matrix.artifact_name }}" "${{ matrix.asset_name }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
