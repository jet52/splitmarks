[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "packetsplitter"
version = "1.0.0"
description = "Split PDF files at top-level bookmarks into separate files"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pypdf>=4.0.0",
]

[project.scripts]
packetsplitter = "packetsplitter:main"
